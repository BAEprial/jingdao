      <h1 class="article-title">异与同</h1>
      <div class="article-meta">2026.05.24</div>
    </header>
    <div class="article-body">
      <p>对沉重话语的态度，这就是我与众人的异同。</p>
      <p>有人听见沉重就转身离开。有人被沉重压垮。有人假装沉重不存在。</p>
      <p>但沉重本身不需要回避。它是生活真实的质地，是认真活过的痕迹。</p>
      <p>我不必在乎他们的想法。</p>
      <p>不是因为傲慢，而是因为在意太久之后终于明白——你的沉重他们不懂，你的轻盈他们也不懂。那不如把力气省下来，用来承受该承受的，享受该享受的。</p>
      <p>异也好，同也罢。最终每个人都有自己的重量要扛。</p>
    </div>
